version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: booking-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: booking-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:9000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9000}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-booking_configuration}
      DB_USER: ${DB_USER:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@local.test}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Administrator}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@local.test}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-ChangeMe123!}
      SEED_ON_START: "true"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: booking-configuration/Dockerfile
    container_name: booking-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      API_TARGET: http://backend:5000
      PORT: ${FRONTEND_PORT:-9000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-9000}:9000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
