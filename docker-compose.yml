version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: booking-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: booking-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Application listens on PORT inside the container (same value published to the host).
      PORT: ${BACKEND_PORT:-5006}
      BACKEND_PORT: ${BACKEND_PORT:-5006}
      APP_NAME: ${APP_NAME:-Booking Configuration}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:9000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9000}
      # The MySQL service is addressed through Docker's internal DNS. This is
      # intentionally separate from the host used for direct local execution.
      DB_HOST: ${DOCKER_DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-booking_configuration}
      DB_USER: ${DB_USER:-booking_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_strong_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@local.test}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Administrator}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@local.test}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-ChangeMe123!}
      SEED_ON_START: "true"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5006}:${BACKEND_PORT:-5006}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||5006)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: booking-configuration/Dockerfile
    container_name: booking-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5006}
      API_TARGET: http://backend:5006
      PORT: ${FRONTEND_PORT:-9000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-9000}:9000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
